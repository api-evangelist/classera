aid: classera
name: Classera
description: 'Classera is an AI-powered education technology company that goes beyond
  a traditional Learning Management System (LMS) to deliver a complete education ecosystem
  spanning LMS, school ERP, fintech and payment solutions, and an educational marketplace,
  with more than 25 integrated services. Its platform emphasizes gamification, personalization,
  AI-driven and social learning, and serves K-12 private schools, higher education,
  ministries of education, and corporate and government training. Classera reports
  more than 30 million users across 45+ countries and partners including Microsoft,
  Amazon Web Services, HP, Zoom, and Intel. Headquartered in San Francisco, it was
  surfaced as a portfolio company of 500 Global and added to the API Evangelist network.'
